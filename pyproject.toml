[project]
name = "event-receiver"
version = "0.1.0"
description = "Приёмник событий с очередью обработки: Flask + SQLite, очередь на таблице"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "python-decouple>=3.8",
]

[project.scripts]
receiver = "receiver.__main__:main"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "pytest>=8.0",
]

[tool.uv]
package = false
